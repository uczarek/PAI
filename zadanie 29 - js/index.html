<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="produkt">
    <button onclick="dodaj()">Dodaj</button>

    <ul id="lista"></ul>
    <p id="licznik"></p>

    <script>
        function dodaj(){
            const pole = document.getElementById("produkt");
            const tekst = pole.value.trim();
            
            if(tekst == ""){
                return;
            }

            const lista = document.getElementById("lista");
            const element = document.createElement("li");

            element.textContent = tekst;
            lista.appendChild(element);
            pole.value = "";

            document.getElementById("licznik").innerHTML = "Liczba produktów: " + lista.children.length;
        }
    </script>
</body>
</html>
