<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="hello">Witaj na mojej stronie!</h1>


    <button onclick="replaceText()" type="send" id="btn">Wyslij</button>
    <hr><br>

    <form>
        <label for="price">Cena:</label>
        <input type="number" id="price" name="price"> 
        <br>

        <label for="amount">Ilosc:</label>
        <input type="number" id="amount" name="amount">
        <br>

        <button type="button" onclick="send()">Oblicz</button>
        <br>

        <p id="result"></p>
    </form>
    <hr><br>

    <label for="length">Dlugosc:</label>
    <input type="number" id="length" name="length"> 
    <br>

    <label for="amount">Szerokosc:</label>
    <input type="number" id="width" name="width">
    <br>

    <label for="surface">plytka:</label>
    <input type="number" id="surface" name="surface">
    <br>

    <button type="button" onclick="calculate()">Oblicz</button>
    <br>

    <p id="result2"></p>


    <script>
        let button = document.getElementById("btn");

        function replaceText(){
            let h1 = document.getElementById("hello").textContent = "Udalo ci sie!";
        }

        function send(){
            let price = document.getElementById("price").value;
            let amount = document.getElementById("amount").value;

            document.getElementById("result").textContent = `Cena to: ${price*amount}zl`;
        }

        function calculate(){
            let length = document.getElementById("length").value;
            let width = document.getElementById("width").value;
            let surface = document.getElementById("surface").value;
            
            document.getElementById("result2").textContent = `Ilosc plytek: ${(length*width)/surface}`
        }




    </script>
</body>
</html>
